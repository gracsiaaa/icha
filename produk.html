<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu | WARUNG RISOLEH</title>
    <link rel="stylesheet" href="style.css" /> 
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
      /* --- STYLE KHUSUS HALAMAN PRODUK & MODAL --- */
      .catalog-header { text-align: center; padding: 40px 20px; background-color: var(--bakery-yellow); }
      .filter-container { max-width: 1000px; margin: -30px auto 40px; background: white; padding: 20px 30px; border-radius: 50px; display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); align-items: center; flex-wrap: wrap; }
      .search-box { flex: 2; position: relative; min-width: 200px; }
      .search-box input { width: 100%; padding: 12px 20px 12px 45px; border: 1px solid #eee; border-radius: 30px; outline: none; font-family: 'Poppins'; }
      .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #aaa; }
      .category-box select { width: 100%; padding: 12px 20px; border: 1px solid #eee; border-radius: 30px; outline: none; cursor: pointer; background-color: white; }
      .catalog-content { background: var(--soft-cream); padding: 60px 20px; border-radius: 50px 50px 0 0; min-height: 500px; }

      /* MODAL / POPUP DETAIL */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
      .modal-content { background: white; max-width: 800px; width: 100%; border-radius: 30px; overflow: hidden; display: flex; flex-wrap: wrap; position: relative; animation: slideUp 0.4s ease; }
      @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      
      .close-modal { position: absolute; top: 20px; right: 25px; font-size: 30px; cursor: pointer; color: #888; z-index: 10; }
      .modal-img { flex: 1; min-width: 300px; height: 400px; }
      .modal-img img { width: 100%; height: 100%; object-fit: cover; }
      .modal-info { flex: 1.2; padding: 40px; min-width: 300px; display: flex; flex-direction: column; justify-content: center; }
      .modal-info h2 { font-family: 'Playfair Display'; font-size: 2rem; margin: 10px 0; }
      .modal-info .price { font-size: 1.5rem; color: var(--accent-green); font-weight: bold; margin-bottom: 20px; }
      .modal-info .desc { color: #666; line-height: 1.6; margin-bottom: 30px; }
    </style>
  </head>
  <body>

    <!-- Navbar Kapsul -->
    <header class="top-header">
      <nav class="navbar-container">
        <div class="nav-pill">
          <div class="nav-left">
            <a href="index.html">Beranda</a>
            <a href="produk.html" class="active">Menu</a>
          </div>
          <div class="nav-center">
            <div class="logo-circle" onclick="window.location.href='index.html'">
              <img src="logo risoleh.jpg" alt="Logo">
            </div>
          </div>
          <div class="nav-right">
            <a href="kontak.html">Tentang Kami</a>
            <div class="cart-trigger" onclick="openCart()">
              <i class="fa-solid fa-basket-shopping"></i> <span id="cart-count">0</span>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <section class="catalog-header">
      <h1 style="font-family: 'Playfair Display'; margin-bottom: 10px;">Menu Kami</h1>
      <p style="margin-bottom: 20px;">Klik gambar untuk melihat deskripsi detail</p>
    </section>

    <!-- Filter & Search -->
    <div class="container">
      <section class="filter-container">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Cari produk..." onkeyup="combinedFilter()">
        </div>
      </section>
    </div>

    <!-- Main Content -->
    <main class="catalog-content">
      <div class="container">
        <div class="product-grid" id="product-list"></div>
      </div>
    </main>

    <!-- POPUP MODAL DETAIL -->
    <div id="product-modal" class="modal-overlay" onclick="closePopup(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closePopup(null)">&times;</span>
        <div class="modal-img">
          <img id="modal-img" src="" alt="">
        </div>
        <div class="modal-info">
          <span id="modal-cat" style="text-transform: uppercase; color: var(--accent-green); font-weight: 600; letter-spacing: 1px;"></span>
          <h2 id="modal-name"></h2>
          <p id="modal-price" class="price"></p>
          <p id="modal-desc" class="desc"></p>
          <button id="modal-add-btn" class="btn-checkout">
            <i class="fa-solid fa-cart-plus"></i> Tambah ke Keranjang
          </button>
        </div>
      </div>
    </div>
     <footer>
      <p>&copy; 2026 WARUNG RISOLEH. Lapar? Jangan tunggu lama!</p>
    </footer>

    <!-- Keranjang Belanja -->
    <div id="cart-sidebar" class="cart-sidebar">
      <div class="cart-header">
        <h2>Keranjang Saya</h2>
        <span class="close-cart" onclick="closeCart()">&times;</span>
      </div>
      <div id="cart-items-container" class="cart-items-list"></div>
      <div class="cart-footer">
        <div class="total-row"><span>Total:</span><span id="cart-total-amount">Rp 0</span></div>
        <button class="btn-checkout" onclick="processCheckoutAll()">Pesan via WhatsApp</button>
      </div>
    </div>
    <div id="cart-overlay" class="cart-overlay" onclick="closeCart()"></div>

    <script src="script.js"></script>
  </body>
</html>
